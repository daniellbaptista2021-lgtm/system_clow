<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar senha · EVOX</title>
<link rel="icon" type="image/png" href="/assets/evox/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --azul: #0A66F5; --azul2: #004BCA; --tinta: #071221; --cinza: #5B6678; --linha: #E6EAF0; --erro: #D92D20; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    font-family: Inter, system-ui, sans-serif; color: var(--tinta); background: #F6F8FB; }
  .cartao { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--linha); border-radius: 20px;
    padding: 32px 26px; box-shadow: 0 16px 40px rgba(7,18,33,.08); }
  .logo { display: block; height: 34px; margin: 0 auto 22px; }
  h1 { font-size: 22px; margin: 0 0 6px; text-align: center; }
  p { color: var(--cinza); font-size: 14px; margin: 0 0 20px; text-align: center; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  input { width: 100%; font: inherit; font-size: 15px; padding: 12px 14px; border: 1px solid var(--linha); border-radius: 12px; margin-bottom: 14px; }
  input:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(10,102,245,.15); }
  button { width: 100%; font: inherit; font-weight: 600; font-size: 15px; color: #fff; background: var(--azul);
    border: 0; border-radius: 12px; padding: 13px; cursor: pointer; }
  button:hover { background: var(--azul2); }
  button:disabled { opacity: .6; cursor: default; }
  .msg { font-size: 14px; margin-top: 14px; text-align: center; min-height: 20px; }
  .erro { color: var(--erro); }
  .ok a { color: var(--azul); font-weight: 600; }
</style>
</head>
<body>
<main class="cartao">
  <img class="logo" src="/assets/evox/evox-logo.png" alt="EVOX">
  <h1>Crie sua senha</h1>
  <p>Ela é a sua chave para entrar no EVOX. Use pelo menos 8 caracteres.</p>
  <form id="f">
    <label for="s1">Nova senha</label>
    <input id="s1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="s2">Repita a senha</label>
    <input id="s2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="b" type="submit">Criar senha</button>
  </form>
  <div class="msg" id="m"></div>
</main>
<script>
  const token = new URLSearchParams(location.search).get('t') || '';
  const m = document.getElementById('m'), b = document.getElementById('b');
  const aviso = (t, erro) => { m.className = 'msg ' + (erro ? 'erro' : 'ok'); m.innerHTML = t; };
  if (!token) aviso('Link incompleto. Abra o link do e-mail de boas-vindas.', true);
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const s1 = document.getElementById('s1').value, s2 = document.getElementById('s2').value;
    if (s1 !== s2) return aviso('As duas senhas não são iguais.', true);
    b.disabled = true; aviso('');
    try {
      const r = await fetch('/auth/definir-senha', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, senha: s1 }) });
      const d = await r.json().catch(() => ({}));
      if (!d.ok) { b.disabled = false; return aviso(d.error || 'Não deu certo. Tente de novo.', true); }
      document.getElementById('f').style.display = 'none';
      aviso('Senha criada! <a href="/">Entrar no EVOX</a> com ' + (d.email || 'o seu e-mail') + '.');
    } catch { b.disabled = false; aviso('Sem conexão. Tente de novo.', true); }
  });
</script>
</body>
</html>
