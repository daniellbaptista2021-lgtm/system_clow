<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>System Clow</title>
<script>
// Aplica o tema salvo (mesma chave do CRM, mesma origem) antes do primeiro
// paint, pra nao piscar o tema errado.
(function(){try{var t=localStorage.getItem('clow_theme');document.documentElement.setAttribute('data-theme',t||'dark');}catch(e){}})();
</script>
<link rel="icon" href="/assets/territorio/icone-192.png">
<link rel="apple-touch-icon" href="/assets/territorio/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#050510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#050510;--bg-1:#0A0A1A;--bg-2:#0F0F24;--bg-3:#14142E;
  --t1:#E8E8F0;--t2:#9898B8;--tm:#585878;
  --p:#E10600;--bl:#FF1F18;--r:#F87171;
  --gp:linear-gradient(135deg,#E10600 0%,#FF1F18 100%);
}
html[data-theme="light"], html[data-theme="system"] { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
html[data-theme="light"]{
  --bg-0:#F7F7FA;--bg-1:#FFFFFF;--bg-2:#FFFFFF;--bg-3:#ECECF2;
  --t1:#14142E;--t2:#6B6B85;--tm:#8C8CA6;
}
@media (prefers-color-scheme: light){
  html[data-theme="system"]{
    --bg-0:#F7F7FA;--bg-1:#FFFFFF;--bg-2:#FFFFFF;--bg-3:#ECECF2;
    --t1:#14142E;--t2:#6B6B85;--tm:#8C8CA6;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;min-height:100dvh}
body{
  font-family:'DM Sans',system-ui,sans-serif;color:var(--t1);background:var(--bg-0);
  display:flex;align-items:center;justify-content:center;padding:20px;
  -webkit-font-smoothing:antialiased;
}
.login-wrap{width:100%;max-width:400px}
.login-card{
  background:var(--bg-1);border:1px solid rgba(225,6,0,.18);border-radius:24px;
  padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.login-brand{display:flex;justify-content:center;margin-bottom:18px}
.login-brand img{height:64px;width:64px;border-radius:16px}
.login-title{font-size:24px;font-weight:700;text-align:center;letter-spacing:-.01em;margin-bottom:8px}
.login-sub{font-size:13px;color:var(--t2);text-align:center;line-height:1.5;margin-bottom:26px}
.login-f{
  width:100%;height:52px;border-radius:14px;border:1px solid var(--bg-3);background:var(--bg-2);
  color:var(--t1);padding:0 16px;margin-bottom:12px;outline:none;font:inherit;font-size:14px;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.login-f::placeholder{color:var(--tm)}
.login-f:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(225,6,0,.12)}
.login-b{
  width:100%;height:52px;border:none;border-radius:14px;background:var(--gp);color:#fff;
  font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;
  transition:filter .15s ease,transform .15s ease;
}
.login-b:hover{filter:brightness(1.06)}
.login-b:active{transform:translateY(1px)}
.login-b:disabled{opacity:.6;cursor:default}
.login-e{min-height:20px;color:var(--r);font-size:13px;margin-top:12px;text-align:center}
.login-loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0}
.login-spin{width:36px;height:36px;border:3px solid rgba(225,6,0,.25);border-top-color:var(--p);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-loading-text{font-size:13px;color:var(--t2)}
.hide{display:none !important}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div id="loadingScreen" class="login-loading">
      <div class="login-spin"></div>
      <div class="login-loading-text">Verificando sessão...</div>
    </div>
    <div id="loginScreen" class="hide">
      <div class="login-brand"><img src="/assets/territorio/icone-192.png" alt="System Clow"></div>
      <div class="login-title">Entre para continuar</div>
      <div class="login-sub">Entre com o email e a senha da sua conta para acessar o CRM.</div>
      <input class="login-f" id="loginUser" type="text" placeholder="Usuário ou email" autocomplete="username" autofocus>
      <input class="login-f" id="loginPass" type="password" placeholder="Senha" autocomplete="current-password">
      <button class="login-b" id="loginBtn" onclick="doLogin()">Entrar</button>
      <div class="login-e" id="loginError"></div>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY = 'clow_token';
const U = '';

// ─── Bridge mode: embed de terceiros manda o token pela URL e espera
// cair direto no agente de IA, não no CRM. Preserva esse comportamento
// encaminhando pra /agente/ com a mesma query string. ───────────────
(function () {
  try {
    const params = new URLSearchParams(location.search);
    const ct = params.get('clow_token');
    if (ct && ct.indexOf('clow_sonnet_') === 0) {
      location.replace('/agente/' + location.search);
      return;
    }
  } catch (e) {}
  boot();
})();

function showLoading(text) {
  document.getElementById('loadingScreen').classList.remove('hide');
  document.getElementById('loginScreen').classList.add('hide');
  if (text) document.querySelector('.login-loading-text').textContent = text;
}
function showLogin() {
  document.getElementById('loadingScreen').classList.add('hide');
  document.getElementById('loginScreen').classList.remove('hide');
}

async function boot() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) { showLogin(); return; }
  showLoading('Verificando sessão...');
  try {
    const r = await fetch(`${U}/auth/verify`, { headers: { Authorization: `Bearer ${token}` } });
    if (r.ok) { location.href = '/crm/'; return; }
  } catch (e) {}
  localStorage.removeItem(TOKEN_KEY);
  showLogin();
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if (!u || !p) { errEl.textContent = 'Preencha todos os campos'; return; }
  btn.disabled = true;
  try {
    const r = await fetch(`${U}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    const d = await r.json().catch(() => ({}));
    if (d.ok && d.token) {
      localStorage.setItem(TOKEN_KEY, d.token);
      localStorage.setItem('clow_login_user', u);
      showLoading('Abrindo seu CRM...');
      location.href = '/crm/';
      return;
    }
    errEl.textContent = d.error === 'invalid_credentials' ? 'Email/usuário ou senha incorretos.'
      : d.error === 'account_blocked' ? 'Conta suspensa. Contate o suporte.'
      : d.error || 'Credenciais inválidas';
  } catch (e) {
    errEl.textContent = 'Erro de conexão';
  }
  btn.disabled = false;
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !document.getElementById('loginScreen').classList.contains('hide')) doLogin();
});
</script>

</body>
</html>
