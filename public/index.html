<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EVOX</title>
<script>
// EVOX: claro e o padrao; escuro so se a pessoa escolheu no CRM (mesma chave).
(function(){var t='light';try{if(localStorage.getItem('evox_tema')==='dark')t='dark';}catch(e){}document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="icon" href="/assets/evox/favicon.png">
<link rel="apple-touch-icon" href="/assets/evox/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F6F8FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FB;--card:#FFFFFF;--line:#E6EAF0;--t1:#071221;--t2:#5B6678;--tm:#8A94A6;
  --p:#0A66F5;--p2:#004BCA;--r:#D92D20;--logo:url('/assets/evox/evox-logo.png');
}
html[data-theme="dark"]{
  color-scheme:dark;--bg:#080C14;--card:#111A2B;--line:rgba(255,255,255,.08);--t1:#E9EEF7;--t2:#8E9AB0;--tm:#66738A;
  --p:#3D8BFF;--p2:#0A66F5;--r:#F97066;--logo:url('/assets/evox/evox-logo-escuro.png');
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;min-height:100dvh}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--t1);background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px 16px;
  -webkit-font-smoothing:antialiased;
}
.login-wrap{width:100%;max-width:380px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 28px 28px;box-shadow:0 12px 40px rgba(7,18,33,.06)}
.login-brand{height:34px;margin:0 auto 28px;background:var(--logo) center/contain no-repeat}
.login-brand img{display:none}
.login-title{font-weight:650;font-size:20px;letter-spacing:-.01em;text-align:center;margin-bottom:6px}
.login-sub{font-size:13.5px;color:var(--t2);text-align:center;line-height:1.5;margin-bottom:24px}
.login-f{
  width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--t1);padding:0 14px;margin-bottom:10px;outline:none;font:inherit;font-size:14.5px;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.login-f::placeholder{color:var(--tm)}
.login-f:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(10,102,245,.12)}
.login-b{
  width:100%;height:48px;border:none;border-radius:12px;background:var(--p);color:#fff;
  font:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;
  transition:background .15s ease,transform .15s ease;
}
.login-b:hover{background:var(--p2)}
.login-b:active{transform:translateY(1px)}
.login-b:disabled{opacity:.6;cursor:default}
.login-e{min-height:20px;color:var(--r);font-size:13px;margin-top:12px;text-align:center}
.login-loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0}
.login-spin{width:32px;height:32px;border:3px solid rgba(10,102,245,.18);border-top-color:var(--p);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-loading-text{font-size:13px;color:var(--t2)}
.hide{display:none !important}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div id="loadingScreen" class="login-loading">
      <div class="login-spin"></div>
      <div class="login-loading-text">Verificando sessão...</div>
    </div>
    <div id="loginScreen" class="hide">
      <div class="login-brand" role="img" aria-label="EVOX"></div>
      <div class="login-title">Entre para continuar</div>
      <div class="login-sub">Acesse sua conta para continuar.</div>
      <input class="login-f" id="loginUser" type="text" placeholder="Usuário ou email" autocomplete="username" autofocus>
      <input class="login-f" id="loginPass" type="password" placeholder="Senha" autocomplete="current-password">
      <button class="login-b" id="loginBtn" onclick="doLogin()">Entrar</button>
      <div class="login-e" id="loginError"></div>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY = 'clow_token';
const U = '';

// ─── Bridge mode: embed de terceiros manda o token pela URL e espera
// cair direto no agente de IA, não no CRM. Preserva esse comportamento
// encaminhando pra /agente/ com a mesma query string. ───────────────
(function () {
  try {
    const params = new URLSearchParams(location.search);
    const ct = params.get('clow_token');
    if (ct && ct.indexOf('clow_sonnet_') === 0) {
      location.replace('/agente/' + location.search);
      return;
    }
  } catch (e) {}
  boot();
})();

function showLoading(text) {
  document.getElementById('loadingScreen').classList.remove('hide');
  document.getElementById('loginScreen').classList.add('hide');
  if (text) document.querySelector('.login-loading-text').textContent = text;
}
function showLogin() {
  document.getElementById('loadingScreen').classList.add('hide');
  document.getElementById('loginScreen').classList.remove('hide');
}

async function boot() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) { showLogin(); return; }
  showLoading('Verificando sessão...');
  try {
    const r = await fetch(`${U}/auth/verify`, { headers: { Authorization: `Bearer ${token}` } });
    if (r.ok) { location.href = '/crm/'; return; }
  } catch (e) {}
  localStorage.removeItem(TOKEN_KEY);
  showLogin();
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if (!u || !p) { errEl.textContent = 'Preencha todos os campos'; return; }
  btn.disabled = true;
  try {
    const r = await fetch(`${U}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    const d = await r.json().catch(() => ({}));
    if (d.ok && d.token) {
      localStorage.setItem(TOKEN_KEY, d.token);
      localStorage.setItem('clow_login_user', u);
      showLoading('Abrindo seu CRM...');
      location.href = '/crm/';
      return;
    }
    errEl.textContent = d.error === 'invalid_credentials' ? 'Email/usuário ou senha incorretos.'
      : d.error === 'account_blocked' ? 'Conta suspensa. Contate o suporte.'
      : d.error || 'Credenciais inválidas';
  } catch (e) {
    errEl.textContent = 'Erro de conexão';
  }
  btn.disabled = false;
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !document.getElementById('loginScreen').classList.contains('hide')) doLogin();
});
</script>

</body>
</html>
