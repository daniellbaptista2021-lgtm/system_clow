##
## docker-compose.evolution.yml — Evolution API DEDICADA do System Clow.
##
## Instância própria, isolada da do crm-territorio (que roda em /opt/evolution
## na porta 8080). Sobe a Evolution API (WhatsApp) + PostgreSQL + Redis, tudo
## com nomes/rede/volumes proprios — nada compartilhado entre os dois apps.
##
## Uso (rodar da raiz do projeto, /opt/system_clow):
##   docker compose -f deploy/docker-compose.evolution.yml --env-file /opt/system_clow/.env up -d
##
## O --env-file é OBRIGATÓRIO: o compose resolve a pasta do projeto pela
## localização deste arquivo (deploy/), não pelo cwd, então sem o --env-file
## explícito ele NÃO acha o .env da raiz e a Evolution sobe com a chave
## default "change_me_evolution_api_key" (foi o que aconteceu no primeiro
## deploy — incidente 2026-08-20, QR code dava 401 silencioso).
##
## Variáveis usadas por este compose (vêm do .env da raiz):
##   EVOLUTION_BASE_URL=http://localhost:8081   (o que src/crm/routes/channels.ts lê —
##                                                NÃO é EVOLUTION_API_URL, esse nome é lixo)
##   EVOLUTION_API_KEY=<chave gerada>
##

services:
  evolution-api:
    container_name: system_clow_evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # ─── Server ─────────────────────────────────────────────────────
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8081}
      - SERVER_PORT=8080

      # ─── Auth ───────────────────────────────────────────────────────
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-change_me_evolution_api_key}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # ─── Database ──────────────────────────────────────────────────
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_PG_PASSWORD:-evolution_pg_secret}@evolution-postgres:5432/evolution_db
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true

      # ─── Cache ─────────────────────────────────────────────────────
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution

      # ─── Webhook (base64 para mídia inline) ────────────────────────
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false

      # ─── Armazenamento de mídia (S3/MinIO) ─────────────────────────
      #
      # DESLIGADO de propósito (incidente 2026-08-25). Com o S3 ligado, o
      # handler de `messages.upsert` da Evolution 2.3.7 faz:
      #
      #     if (isMedia && S3.ENABLE) {
      #       const D = await this.getBase64FromMediaMessage(...);
      #       if (!D) { this.logger.verbose(...); return }   // <- aborta tudo
      #       ...upload MinIO...
      #     }
      #     ...
      #     this.sendDataWebhook("messages.upsert", c);      // <- nunca alcançado
      #
      # Quando a extração do binário falha, ele RETORNA antes de disparar o
      # webhook. A mensagem fica gravada no Postgres da Evolution e o CRM nunca
      # fica sabendo. Como o aviso é `verbose` e LOG_LEVEL=WARN, some sem log.
      # Isso derrubava 92% da mídia que o corretor mandava do próprio aparelho
      # (256 áudios, 76 fotos entre 20/08 e 25/08) — a mídia recebida do cliente
      # baixa normal e não era afetada.
      #
      # Desligar tira o bloco defeituoso do caminho. O comentário anterior dizia
      # que sem S3 a Evolution não entrega `message.base64`; isso não vale para a
      # 2.3.7 — o bloco que anexa o base64 é guardado por
      # `localWebhook.enabled && isMedia && webhookBase64`, não por `S3.ENABLE`,
      # e roda num try/catch que não aborta o envio do webhook. O CRM prefere o
      # base64 (`item.message?.base64 || item.base64`) e guarda cópia própria em
      # /var/lib/system-clow/crm-media, então o MinIO era redundante para ele.
      - S3_ENABLED=false
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-clowminio}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      - S3_BUCKET=evolution
      - S3_PORT=9000
      - S3_ENDPOINT=evolution-minio
      - S3_USE_SSL=false
      # Vídeo é o único tipo que a Evolution deixa desligado por padrão.
      - S3_SAVE_VIDEO=true

      # ─── Logs ──────────────────────────────────────────────────────
      - LOG_LEVEL=WARN
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
      evolution-minio:
        condition: service_healthy
    networks:
      - system_clow_evolution-net
    healthcheck:
      # `curl` não existe nesta imagem — o healthcheck antigo acumulou 1577
      # falhas seguidas com "executable file not found" e marcava o container
      # como unhealthy enquanto o serviço estava perfeito. O node está sempre
      # presente, já que a aplicação roda nele.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  evolution-postgres:
    container_name: system_clow_evolution_postgres
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=evolution_db
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_PG_PASSWORD:-evolution_pg_secret}
    volumes:
      - system_clow_evolution-pgdata:/var/lib/postgresql/data
    networks:
      - system_clow_evolution-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    container_name: system_clow_evolution_redis
    image: redis:7-alpine
    restart: always
    volumes:
      - system_clow_evolution-redisdata:/data
    networks:
      - system_clow_evolution-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Guarda o binário das mídias do WhatsApp. Fica só na rede interna do
  # compose — a Evolution serve os arquivos, ninguém precisa alcançar o MinIO
  # de fora, e uma porta a menos exposta é uma porta a menos para proteger.
  evolution-minio:
    container_name: system_clow_evolution_minio
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-clowminio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - system_clow_evolution-minio:/data
    networks:
      - system_clow_evolution-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  system_clow_evolution-net:
    driver: bridge

volumes:
  system_clow_evolution-pgdata:
  system_clow_evolution-redisdata:
  system_clow_evolution-minio:
