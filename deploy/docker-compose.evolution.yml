##
## docker-compose.evolution.yml — Evolution API DEDICADA do System Clow.
##
## Instância própria, isolada da do crm-territorio (que roda em /opt/evolution
## na porta 8080). Sobe a Evolution API (WhatsApp) + PostgreSQL + Redis, tudo
## com nomes/rede/volumes proprios — nada compartilhado entre os dois apps.
##
## Uso (rodar da raiz do projeto, /opt/system_clow):
##   docker compose -f deploy/docker-compose.evolution.yml --env-file /opt/system_clow/.env up -d
##
## O --env-file é OBRIGATÓRIO: o compose resolve a pasta do projeto pela
## localização deste arquivo (deploy/), não pelo cwd, então sem o --env-file
## explícito ele NÃO acha o .env da raiz e a Evolution sobe com a chave
## default "change_me_evolution_api_key" (foi o que aconteceu no primeiro
## deploy — incidente 2026-08-20, QR code dava 401 silencioso).
##
## Variáveis usadas por este compose (vêm do .env da raiz):
##   EVOLUTION_BASE_URL=http://localhost:8081   (o que src/crm/routes/channels.ts lê —
##                                                NÃO é EVOLUTION_API_URL, esse nome é lixo)
##   EVOLUTION_API_KEY=<chave gerada>
##

services:
  evolution-api:
    container_name: system_clow_evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # ─── Server ─────────────────────────────────────────────────────
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8081}
      - SERVER_PORT=8080

      # ─── Auth ───────────────────────────────────────────────────────
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-change_me_evolution_api_key}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # ─── Database ──────────────────────────────────────────────────
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_PG_PASSWORD:-evolution_pg_secret}@evolution-postgres:5432/evolution_db
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true

      # ─── Cache ─────────────────────────────────────────────────────
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution

      # ─── Webhook (base64 para mídia inline) ────────────────────────
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false

      # ─── Logs ──────────────────────────────────────────────────────
      - LOG_LEVEL=WARN
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    networks:
      - system_clow_evolution-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  evolution-postgres:
    container_name: system_clow_evolution_postgres
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=evolution_db
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_PG_PASSWORD:-evolution_pg_secret}
    volumes:
      - system_clow_evolution-pgdata:/var/lib/postgresql/data
    networks:
      - system_clow_evolution-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    container_name: system_clow_evolution_redis
    image: redis:7-alpine
    restart: always
    volumes:
      - system_clow_evolution-redisdata:/data
    networks:
      - system_clow_evolution-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  system_clow_evolution-net:
    driver: bridge

volumes:
  system_clow_evolution-pgdata:
  system_clow_evolution-redisdata:
